<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>

  <!--======================
  CSS
  ======================-->
  <style>
    body {
      background-color: black;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 100px;
    }

    h1 {
      color: white;
    }

    input {
      padding: 10px;
      font-size: 16px;
    }

    button {
      background-color: white;
      color: black;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      color: white;
      font-size: 24px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <!--======================
  HTML
  ======================-->

  <h1>Number Guessing Game</h1>

  <p>Guess a number between 1 and 10!</p>

  <label for="playerGuess">Your Guess:</label>

  <input type="number" id="playerGuess"
         placeholder="Enter a number">

  <button id="submitGuess">Submit Guess</button>

  <p id="result"></p>

  <!--======================
  JavaScript
  ======================-->
  <script>

    function getRandomNumber(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function processGuess() {
      const min = 1;
      const max = 10;

      // Generate random number
      const randomNumber = getRandomNumber(min, max);

      // Get player's guess
      const numberGuessed = Number(
        document.getElementById("playerGuess").value
      );

      if (
        !Number.isInteger(numberGuessed) ||
        numberGuessed < 1 ||
        numberGuessed > 10
      ) {
        document.getElementById("result").textContent =
          "Please enter a whole number between 1 and 10.";
        return;
      }

      if (randomNumber === numberGuessed) {
        document.getElementById("result").textContent =
          "You guessed " + numberGuessed +
          " and the number was " + randomNumber +
          ". You win!";
      } else {
        document.getElementById("result").textContent =
          "You guessed " + numberGuessed +
          " and the number was " + randomNumber +
          ". Sorry, try again!";
      }
    }

    document.getElementById("submitGuess")
      .addEventListener("click", processGuess);

  </script>

</body>
</html>
